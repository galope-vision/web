name: Feature
description: Propose a new feature or change.
title: 'feat: '
labels: ['type: feature']
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible, and for whom (visitor, editor, developer)?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Behavior, design references, links to docs/spec.md sections.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Phase
      placeholder: 'e.g. 3 · Projects (v0.4.0)'
