name: Deploy

# Production deploy to the DonWeb shared hosting over FTPS
# (docs/adr/0003-static-hosting-donweb-ftp.md). Publishing from the CMS merges the entry's pull
# request into `main`, so this is also what puts the client's own content live.
on:
  push:
    branches: [main]
  # So a failed deploy can be retried without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

# Never two deploys at once against the same FTP account, and never cancel one half way: the
# action syncs file by file, so an interrupted run leaves the site in a mixed state.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to DonWeb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The build validates the content schemas, so bad content fails here and never reaches
      # production (CLAUDE.md, "Content model").
      - run: npm run build

      # Fail with a readable message instead of letting the action deploy into the FTP root,
      # which on shared hosting is the parent of the web directory.
      - name: Check the deploy settings are configured
        env:
          SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          if [ -z "$SERVER_DIR" ]; then
            echo "::error::The FTP_SERVER_DIR repository variable is not set. It is the web" \
                 "directory of the hosting account, with a trailing slash — /httpdocs/ on the" \
                 "Ferozo panel, /public_html/ on cPanel. See docs/deploy-setup.md."
            exit 1
          fi
          case "$SERVER_DIR" in
            */) ;;
            *) echo "::error::FTP_SERVER_DIR must end with a slash."; exit 1 ;;
          esac

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Explicit FTPS: plain FTP would send the password in the clear.
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          # The action keeps this file on the server to know what changed, so each deploy only
          # uploads the difference. Deleting it on the server forces a full upload.
          state-name: .ftp-deploy-sync-state.json
