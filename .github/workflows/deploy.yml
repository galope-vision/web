name: Deploy

# Production deploy to the DonWeb shared hosting over FTPS
# (docs/adr/0003-static-hosting-donweb-ftp.md). Publishing from the CMS merges the entry's pull
# request into `main`, so this is also what puts the client's own content live.
on:
  push:
    branches: [main]
  # So a failed deploy can be retried without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Until launch day, production shows only the holding page (the launch date); the whole site
  # lives on the dev preview, dev.galope-web.pages.dev (preview.yml). Launching is changing this
  # to 'true'. The FTP action syncs, so the next deploy also deletes from the server whatever a
  # previous deploy left there.
  LAUNCHED: 'false'
  # Google Tag Manager (docs/adr/0008-google-tag-manager.md). Not a secret: it ships in the HTML
  # of every page. Only this workflow sets it, so dev, CI and the previews build with no tag at
  # all. Changing the container means editing this line.
  PUBLIC_GTM_ID: GTM-W5Q3RH53

# Never two deploys at once against the same FTP account, and never cancel one half way: the
# action syncs file by file, so an interrupted run leaves the site in a mixed state.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to DonWeb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The build validates the content schemas, so bad content fails here and never reaches
      # production (CLAUDE.md, "Content model").
      - run: npm run build

      # Production is the only build that carries the tag, so it is the only place a mistake in
      # PUBLIC_GTM_ID shows up — as a live site with no analytics and no error anywhere. Fail
      # the deploy instead.
      - name: Check the Google Tag Manager container is in the build
        run: |
          grep -q "googletagmanager.com/gtm.js" dist/index.html \
            || { echo "::error::PUBLIC_GTM_ID did not reach the build (ADR 0008)."; exit 1; }

      # Keeps the home in both locales, the 404, the CMS and the shared assets (/_astro, /img,
      # favicons, .htaccess, robots.txt). The images of the projects stay in /_astro under hashed
      # names nothing links to.
      - name: Keep only the holding page until launch
        if: env.LAUNCHED != 'true'
        run: |
          cd dist
          rm -rf proyectos info contacto estilos sitemap.xml
          find en -mindepth 1 -maxdepth 1 ! -name index.html -exec rm -rf {} +
          sed -i '/^Sitemap:/d' robots.txt
          echo "HTML left in production:"
          find . -name '*.html' | sort
          extra=$(find . -name '*.html' ! -path ./index.html ! -path ./en/index.html \
            ! -path ./404.html ! -path ./admin/index.html)
          if [ -n "$extra" ]; then
            echo "::error::Pages other than the holding page would reach production: $extra"
            exit 1
          fi

      # Fail with a readable message instead of letting the action deploy into the FTP root,
      # which on shared hosting is the parent of the web directory.
      - name: Check the deploy settings are configured
        env:
          SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          if [ -z "$SERVER_DIR" ]; then
            echo "::error::The FTP_SERVER_DIR repository variable is not set. On this account" \
                 "it is /public_html/ — confirmed on the server, not guessed from the panel." \
                 "See docs/deploy-setup.md."
            exit 1
          fi
          case "$SERVER_DIR" in
            */) ;;
            *) echo "::error::FTP_SERVER_DIR must end with a slash."; exit 1 ;;
          esac
          # A wrong-but-plausible directory is the failure this whole file is shaped around: the
          # upload succeeds into a folder nothing serves, every check is green and the site never
          # changes. /httpdocs/ is the one that actually happened, because the Ferozo docs say so
          # and this account does not use it. Refuse it by name rather than let it pass twice.
          if [ "$SERVER_DIR" = "/httpdocs/" ]; then
            echo "::error::FTP_SERVER_DIR is /httpdocs/, which is not the web root of this" \
                 "account. It is /public_html/. Uploading to /httpdocs/ reports success and" \
                 "leaves the live site untouched. See docs/deploy-setup.md."
            exit 1
          fi

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Explicit FTPS: plain FTP would send the password in the clear.
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          # The action keeps this file on the server to know what changed, so each deploy only
          # uploads the difference. Deleting it on the server forces a full upload.
          state-name: .ftp-deploy-sync-state.json
